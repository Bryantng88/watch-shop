name: Technical completion response
on:
  pull_request:
    paths:
      - 'src/domains/task/actions/operational-action-response.actions.ts'
      - 'src/domains/task/client/operational-action.client.ts'
      - 'src/domains/task/shared/operational-action-response.ts'
      - 'src/domains/service/server/issue-board/service-issue-board.service.ts'
      - 'src/domains/coordination/ui/OperationCoordinationWorkspace.tsx'
      - 'src/domains/coordination/ui/FlowItemListView.tsx'
      - 'src/domains/task/ui/task-work/QueueWorkQueue.tsx'
      - 'tests/service/technical-completion-response*'
      - '.github/workflows/technical-completion-response.yml'
permissions:
  contents: read
jobs:
  completion-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/service/technical-completion-response.test.cjs
      - run: npx eslint src/domains/task/shared/operational-action-response.ts src/domains/task/actions/operational-action-response.actions.ts src/domains/task/client/operational-action.client.ts
      - run: npx tailwindcss -i src/app/globals.css -o /tmp/technical-completion.css --minify
      - run: npm install --prefix /tmp/completion-browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: /tmp/completion-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/completion-browser/node_modules/playwright node tests/service/technical-completion-response-ui.cjs
