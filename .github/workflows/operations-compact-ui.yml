name: Operations compact UI
on:
  pull_request:
    paths:
      - 'src/domains/admin-home/**'
      - 'src/domains/coordination/ui/Operation*'
      - 'src/domains/coordination/ui/TechnicalIssueListView*'
      - 'src/domains/coordination/ui/FlowItemListView.tsx'
      - 'src/domains/coordination/ui/MediaRowActions.tsx'
      - 'src/domains/coordination/shared/technical-issue-list.ts'
      - 'tests/browser/technical-issue-list.fixture.tsx'
      - 'scripts/check-operation-stage-menu.mjs'
      - 'scripts/check-operation-resize.mjs'
      - 'src/domains/shared/ui/space/SpaceViewShell.tsx'
      - 'scripts/smoke-technical-issue-list-browser.cjs'
      - 'src/domains/shared/ui/admin-design-contract/**'
      - 'scripts/smoke-operations-compact-ui.cjs'
      - 'scripts/smoke-operations-execution.ts'
      - 'src/domains/projection/server/media-operation-board.projection.ts'
      - 'src/domains/projection/server/technical-issue-board.projection.ts'
      - '.github/workflows/operations-compact-ui.yml'
permissions:
  contents: read
jobs:
  operations-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: synthetic-fixture-only
          POSTGRES_DB: operations_ui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d operations_ui_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fixture:synthetic-fixture-only@127.0.0.1:5432/operations_ui_test
      DIRECT_URL: postgresql://fixture:synthetic-fixture-only@127.0.0.1:5432/operations_ui_test
      OPERATIONS_FIXTURE_DB: '1'
      S3_BUCKET: synthetic-operations-media
      APP_URL: http://127.0.0.1:3015
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/domains/admin-home/ui/*.tsx src/domains/admin-home/shared/execution-summary.ts src/domains/admin-home/application/attention-selection.ts src/domains/admin-home/application/dashboard-attention.query.ts src/domains/admin-home/application/execution-summary.query.ts src/domains/admin-home/application/get-operations-dashboard.application.ts scripts/smoke-operations-execution.ts
      - run: node --import tsx --test src/domains/admin-home/application/*.test.ts
      - run: npx prisma db push --skip-generate
      - run: node --import tsx scripts/smoke-operations-execution.ts
      - run: npx tsc --noEmit
      - run: npx tailwindcss -i src/app/globals.css -o /tmp/operations-ui.css --minify
      - run: npm install --prefix /tmp/operations-browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: /tmp/operations-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/operations-browser/node_modules/playwright node scripts/smoke-operations-compact-ui.cjs
      - run: >-
          npx eslint src/domains/coordination/ui/OperationCoordinationWorkspace.tsx
          src/domains/coordination/ui/TechnicalIssueListView.tsx
          src/domains/coordination/ui/FlowItemListView.tsx
          src/domains/coordination/ui/MediaRowActions.tsx
          src/domains/coordination/shared/technical-issue-list.ts
          src/domains/shared/ui/admin-design-contract/AdminRowActionMenu.tsx
          src/domains/shared/ui/admin-design-contract/AdminOperationList.ts
          tests/browser/technical-issue-list.fixture.tsx scripts/check-operation-stage-menu.mjs
          scripts/smoke-technical-issue-list-browser.cjs
          src/domains/shared/ui/admin-design-contract/AdminTechnicalList.ts
          src/domains/shared/ui/admin-design-contract/AdminSplitResize.tsx
          src/domains/shared/ui/space/SpaceViewShell.tsx
          src/domains/coordination/ui/OperationWorkspaceLayout.tsx
          scripts/check-operation-resize.mjs
      - run: node scripts/check-operation-stage-menu.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/operations-browser/node_modules/playwright
          STAGE_MENU_SCREENSHOT_DIR: /tmp/operations-compact/stages
      - run: node scripts/smoke-technical-issue-list-browser.cjs
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/operations-browser/node_modules/playwright
          TI_PREVIEW_CSS: /tmp/operations-ui.css
          TI_DESKTOP_SCREENSHOT: /tmp/operations-compact/ti-list-desktop.png
          TI_MOBILE_SCREENSHOT: /tmp/operations-compact/ti-list-mobile.png
      - run: node scripts/check-operation-resize.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/operations-browser/node_modules/playwright
          OPERATION_RESIZE_SCREENSHOT_DIR: /tmp/operations-compact/resize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-dashboard-preview
          path: /tmp/operations-compact/**/*.png
      - run: npm run build
