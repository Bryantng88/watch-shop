name: Order form compact UI
on:
  pull_request:
    paths:
      - 'src/domains/order/client/OrderFormClient.tsx'
      - 'src/domains/order/ui/form/**'
      - 'src/domains/order/ui/OrderSection.tsx'
      - 'src/domains/order/ui/OrderPageHeader.tsx'
      - 'src/app/(admin)/admin/orders/**'
      - 'scripts/smoke-order-compact-ui.cjs'
      - '.github/workflows/order-compact-ui.yml'
permissions:
  contents: read
jobs:
  order-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/domains/order/client/OrderFormClient.tsx src/domains/order/ui/OrderPageHeader.tsx src/domains/order/ui/OrderSection.tsx src/domains/order/ui/form/*.tsx 'src/app/(admin)/admin/orders/new/page.tsx' 'src/app/(admin)/admin/orders/[id]/edit/page.tsx'
      - run: npx tailwindcss -i src/app/globals.css -o /tmp/order-ui.css --minify
      - run: npm install --prefix /tmp/order-browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: /tmp/order-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/order-browser/node_modules/playwright ORDER_UI_CSS=/tmp/order-ui.css node scripts/smoke-order-compact-ui.cjs
