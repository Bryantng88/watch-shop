name: Technician mobile workspace
on:
  pull_request:
    paths:
      - 'src/domains/service/client/technician/**'
      - 'src/domains/service/server/technician/**'
      - 'src/domains/service/shared/technician-workspace.ts'
      - 'src/app/(admin)/admin/services/technician/**'
      - 'src/app/(admin)/admin/_client/AdminShell.tsx'
      - 'src/app/(admin)/admin/_client/AdmidSideBar.tsx'
      - 'tests/service/technician-workspace*'
      - '.github/workflows/technician-mobile-ui.yml'
permissions:
  contents: read
jobs:
  technician-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/service/technician-workspace.test.cjs
      - run: npx eslint src/domains/service/client/technician src/domains/service/server/technician src/domains/service/shared/technician-workspace.ts
      - run: npx tailwindcss -i src/app/globals.css -o /tmp/technician.css --minify
      - run: npm install --prefix /tmp/technician-browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: /tmp/technician-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/technician-browser/node_modules/playwright node tests/service/technician-workspace-ui.cjs
