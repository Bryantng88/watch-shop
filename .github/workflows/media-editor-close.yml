name: Media editor close
on:
  pull_request:
    paths:
      - 'src/domains/task/ui/task-work/QueueWorkQueue.tsx'
      - 'src/domains/watch/client/WatchFormClient.tsx'
      - 'src/domains/watch/client/WatchListClient.tsx'
      - 'src/domains/watch/ui/edit/WatchImageSection.tsx'
      - 'src/domains/watch/ui/edit/WatchSpecModal.tsx'
      - 'src/domains/media-post/ui/MediaPostEditor.tsx'
      - 'src/domains/shared/ui/transitions/**'
      - 'scripts/smoke-media-target-close.cjs'
      - '.github/workflows/media-editor-close.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx eslint src/domains/task/ui/task-work/QueueWorkQueue.tsx
          src/domains/watch/client/WatchFormClient.tsx
          src/domains/watch/client/WatchListClient.tsx
          src/domains/watch/ui/edit/WatchImageSection.tsx
          src/domains/watch/ui/edit/WatchSpecModal.tsx
          src/domains/shared/ui/transitions/workspace-transition-outcome.ts
          src/domains/media-post/ui/MediaPostEditor.tsx
      - run: npx tsc --noEmit
      - run: npm install --prefix /tmp/media-close-browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: /tmp/media-close-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/media-close-browser/node_modules/playwright node scripts/smoke-media-target-close.cjs
      - run: npm run build
