name: Storefront home contract
on:
  pull_request:
    paths:
      - 'src/domains/storefront/content/**'
      - 'src/app/(admin)/admin/storefront/home/**'
      - 'src/app/api/admin/storefront/content/**'
      - 'src/app/(public)/storefront.css'
      - 'src/app/(admin)/admin/_client/AdmidSideBar.tsx'
      - 'src/server/auth/admin-api-policy.ts'
      - 'package*.json'
      - '.github/workflows/storefront-home-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run storefront:smoke-content
      - run: >-
          npx eslint src/domains/storefront/content
          src/app/api/admin/storefront/content/route.ts
          'src/app/(admin)/admin/storefront/home'
      - run: npx tsc --noEmit
