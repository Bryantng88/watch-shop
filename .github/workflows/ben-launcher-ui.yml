name: Ben draggable launcher
on:
  pull_request:
    paths:
      - 'src/domains/ai-assistant/BenLauncher.tsx'
      - 'src/domains/ai-assistant/BenAvatar.tsx'
      - 'src/domains/ai-assistant/AiAssistant.tsx'
      - 'tests/pwa/ben-launcher-ui.cjs'
      - '.github/workflows/ben-launcher-ui.yml'
permissions:
  contents: read
jobs:
  launcher-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/domains/ai-assistant/BenLauncher.tsx src/domains/ai-assistant/AiAssistant.tsx
      - run: npx tailwindcss -i src/app/globals.css -o /tmp/ben-launcher.css --minify
      - run: npm install --prefix /tmp/ben-launcher-browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: /tmp/ben-launcher-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/ben-launcher-browser/node_modules/playwright node tests/pwa/ben-launcher-ui.cjs
