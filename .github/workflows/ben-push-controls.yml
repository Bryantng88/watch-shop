name: Ben push settings
on:
  pull_request:
    paths:
      - 'src/domains/ai-assistant/BenPushControls.tsx'
      - 'src/domains/ai-assistant/AiAssistant.tsx'
      - 'scripts/smoke-ben-push-controls.cjs'
      - '.github/workflows/ben-push-controls.yml'
permissions:
  contents: read
jobs:
  push-controls-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/domains/ai-assistant/BenPushControls.tsx src/domains/ai-assistant/AiAssistant.tsx
      - run: npm install --prefix /tmp/ben-push-browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: /tmp/ben-push-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/ben-push-browser/node_modules/playwright node scripts/smoke-ben-push-controls.cjs
