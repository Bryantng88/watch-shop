name: Responsive personal work UI
on:
  pull_request:
    paths:
      - 'scripts/lib/admin-fixture-esbuild.cjs'
      - 'src/domains/personal-work/ui/**'
      - 'src/domains/personal-work/server/google-calendar*'
      - 'src/app/api/admin/personal-work/calendar/**'
      - 'src/domains/shared/ui/admin-design-contract/**'
      - 'src/app/globals.css'
      - 'scripts/smoke-work-responsive-ui.cjs'
      - 'scripts/check-work-modal-feedback.cjs'
      - 'scripts/check-work-checklist-mobile.cjs'
      - 'scripts/check-media-merge-ui.cjs'
      - 'scripts/check-continuous-work-ui.cjs'
      - 'src/domains/personal-work/shared/continuous-work*'
      - 'src/domains/personal-work/shared/media-merge*'
      - 'src/domains/personal-work/server/media-merge*'
      - 'src/domains/work-media/ui/**'
      - 'src/domains/shared/feedback/AppToastProvider.tsx'
      - 'scripts/smoke-admin-view-tabs.cjs'
      - 'public/ben-sw.js'
      - 'tests/pwa/ben-service-worker.test.mjs'
      - 'src/server/auth/login-destination*'
      - '.github/workflows/work-responsive-ui.yml'
permissions:
  contents: read
jobs:
  work-responsive-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --generator client
      - run: npx tsc --noEmit
      - run: node --import tsx --test src/domains/personal-work/server/google-calendar-error.test.ts src/domains/personal-work/server/google-event-edit.test.ts
      - run: node --import tsx --test src/domains/personal-work/shared/media-merge.test.ts src/domains/personal-work/shared/continuous-work.test.ts
      - run: node --test tests/pwa/ben-service-worker.test.mjs
      - run: node --import tsx --test src/server/auth/login-destination.test.ts
      - run: npx eslint src/domains/shared/ui/admin-design-contract/AdminViewTabs.tsx src/domains/personal-work/ui/PersonalWorkClient.tsx src/domains/personal-work/ui/PersonalWorkListRow.tsx src/domains/personal-work/ui/PersonalWorkListToolbar.tsx src/domains/personal-work/ui/PersonalWorkFloatingPanel.tsx src/domains/personal-work/ui/PersonalWorkUpdateHint.tsx
      - run: npx eslint src/domains/shared/feedback/AppToastProvider.tsx scripts/check-work-modal-feedback.cjs scripts/smoke-work-responsive-ui.cjs
      - run: npx eslint src/domains/personal-work/ui/PersonalChecklistTitle.tsx src/domains/work-media/ui/WorkImageAttachments.tsx scripts/check-work-checklist-mobile.cjs
      - run: npx tailwindcss -i src/app/globals.css -o /tmp/work-responsive.css --minify
      - run: npm install --prefix /tmp/work-responsive-browser --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: /tmp/work-responsive-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/work-responsive-browser/node_modules/playwright WORK_RESPONSIVE_CSS=/tmp/work-responsive.css node scripts/smoke-work-responsive-ui.cjs
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/work-responsive-browser/node_modules/playwright WORK_RESPONSIVE_CSS=/tmp/work-responsive.css node scripts/smoke-admin-view-tabs.cjs
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/work-responsive-browser/node_modules/playwright node scripts/check-work-modal-feedback.cjs
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/work-responsive-browser/node_modules/playwright node scripts/check-work-checklist-mobile.cjs
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/work-responsive-browser/node_modules/playwright node scripts/check-media-merge-ui.cjs
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/work-responsive-browser/node_modules/playwright node scripts/check-continuous-work-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-admin-tabs-preview
          path: /tmp/admin-view-tabs/*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-checklist-mobile-preview
          path: /tmp/work-checklist-mobile/*.png
