name: Shared admin buttons
on:
  pull_request:
    paths:
      - 'scripts/lib/admin-fixture-esbuild.cjs'
      - 'src/app/(admin)/**'
      - 'src/domains/**'
      - 'src/components/**'
      - 'scripts/check-admin-buttons.mjs'
      - 'scripts/smoke-admin-buttons-browser.cjs'
      - 'scripts/smoke-ti-board-preview-browser.cjs'
      - 'tests/browser/admin-buttons.fixture.tsx'
      - 'package*.json'
      - '.github/workflows/admin-buttons-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:admin-buttons
      - run: >-
          npx eslint src/domains/shared/ui/admin-design-contract/AdminButton.tsx
          src/domains/shared/ui/admin-design-contract/AdminButtonSurface.ts
          scripts/check-admin-buttons.mjs scripts/smoke-admin-buttons-browser.cjs scripts/smoke-ti-board-preview-browser.cjs
          tests/browser/admin-buttons.fixture.tsx
      - run: npx prisma generate --generator client
      - run: npx tsc --noEmit
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-admin-buttons-browser.cjs
      - run: node scripts/smoke-ti-board-preview-browser.cjs
