name: Work notifications and compact UI
on:
  pull_request:
    paths:
      - 'src/domains/notification/**'
      - 'src/domains/personal-work/**'
      - 'src/domains/ai-assistant/**'
      - 'src/domains/task/**'
      - 'src/app/api/internal/work-push/**'
      - 'src/app/api/auth/logout/**'
      - 'prisma/**'
      - 'public/ben-sw.js'
      - 'ops/notifications/**'
      - 'scripts/smoke-work-push.ts'
      - '.github/workflows/work-push.yml'
permissions:
  contents: read
jobs:
  notification-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: synthetic-fixture-only
          POSTGRES_DB: work_push_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d work_push_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fixture:synthetic-fixture-only@127.0.0.1:5432/work_push_test
      DIRECT_URL: postgresql://fixture:synthetic-fixture-only@127.0.0.1:5432/work_push_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --generator client
      - run: npx prisma db push --skip-generate
      - run: timeout 90s node --import tsx scripts/smoke-work-push.ts
      - run: node --import tsx --test src/domains/notification/server/work-push-policy.test.ts
      - run: node --test tests/pwa/ben-service-worker.test.mjs
