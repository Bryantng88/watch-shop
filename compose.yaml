name: watch-shop

services:
  app:
    image: watch-shop:${IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
      secrets:
        - env_build
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  migrate:
    image: watch-shop-ops:${IMAGE_TAG:-local}
    build:
      context: .
      target: ops
    env_file:
      - .env.production
    profiles:
      - tools
    restart: "no"

secrets:
  env_build:
    file: .env.build
