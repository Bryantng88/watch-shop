# LAN-only admin staging ingress. Run this proxy on the same Docker network as
# the staging application and publish it only on the NAS LAN address.
#
# Example container binding:
#   192.168.1.253:18089 -> 8080
#
# Do not add router forwarding for this port. When external admin staging is
# required, use a dedicated hostname behind Cloudflare Access instead.
server {
    listen 8080;
    server_name _;

    client_max_body_size 32m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /login { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }
    location = /403 { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }
    location = /profile { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }
    location ^~ /admin { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }

    location ^~ /api/auth/ { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }
    location ^~ /api/admin/ { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }
    location ^~ /api/media/ { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }
    location = /api/profile { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }
    location ^~ /api/profile/ { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }

    location ^~ /_next/static/ { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }
    location = /_next/image { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }
    location = /favicon.ico { proxy_pass http://watch-shop-storefront-staging-admin-app:3000; }

    # Public storefront, integrations, internal jobs and operations endpoints
    # are intentionally unavailable from the admin staging ingress.
    location / { return 404; }
}
