server {
    listen 8080;
    server_name vinticwatches.vn www.vinticwatches.vn;

    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = / { proxy_pass http://app:3000; }
    location = /request { proxy_pass http://app:3000; }
    location = /offline { proxy_pass http://app:3000; }
    location = /manifest.webmanifest { proxy_pass http://app:3000; }
    location = /sw.js { proxy_pass http://app:3000; }
    location = /storefront-icon.svg { proxy_pass http://app:3000; }
    location = /vintic-v.svg { proxy_pass http://app:3000; }
    location = /storefront-maskable.svg { proxy_pass http://app:3000; }

    location ^~ /products { proxy_pass http://app:3000; }
    location ^~ /api/public/ { proxy_pass http://app:3000; }
    location = /api/integrations/zalo/events { proxy_pass http://app:3000; }
    location ^~ /_next/static/ { proxy_pass http://app:3000; }
    location = /_next/image { proxy_pass http://app:3000; }

    location / { return 404; }
}
